[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'vulnlens'
version = '0.2.0'
description = 'Local-first security checks for secrets, Dockerfiles, and GitHub Actions.'
readme = 'README.md'
requires-python = '>=3.10'
license = {file = 'LICENSE'}
keywords = ['security', 'devsecops', 'appsec', 'secret-scanning', 'sarif', 'osv']
classifiers = ['Development Status :: 3 - Alpha', 'Environment :: Console', 'Programming Language :: Python :: 3', 'Topic :: Security']
dependencies = []

[project.scripts]
vulnlens = 'vulnlens.cli:main'
vulnlens-deps = 'vulnlens.deps:main'\nvulnlens-benchmark = 'vulnlens.benchmark:main'\nvulnlens-history = 'vulnlens.history:main'\nvulnlens-fix-preview = 'vulnlens.fix_preview:main'

[tool.setuptools.packages.find]
include = ['vulnlens*']
